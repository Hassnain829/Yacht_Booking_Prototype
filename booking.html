<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Charter — Chicago Yacht Booking</title>
  <meta name="description" content="Choose your experience, yacht, date and time. Live availability and instant confirmation.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js')</script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-shell font-sans text-navy-900 antialiased" data-page="booking">
  <div id="site-header"></div>

  <!-- Laravel: resources/views/booking/create.blade.php
       Availability + quote endpoints: GET /api/availability, POST /api/quote -->
  <main class="pb-28 lg:pb-0">
    <section class="relative isolate overflow-hidden bg-navy-950 pb-28 pt-36 text-white md:pt-40">
      <img src="assets/images/wake.jpg" alt="" class="absolute inset-0 -z-20 h-full w-full object-cover opacity-25">
      <div class="absolute inset-0 -z-10 bg-gradient-to-b from-navy-950/70 to-navy-950"></div>
      <div class="container">
        <div class="flex flex-col justify-between gap-6 md:flex-row md:items-end">
          <div>
            <p class="flex items-center gap-3 text-xs font-bold uppercase tracking-[0.3em] text-brass-300"><span class="h-px w-10 bg-brass-400"></span>Online booking</p>
            <h1 class="mt-4 font-display text-4xl md:text-6xl">Book your charter</h1>
            <p class="mt-3 text-white/60">Pick a date. Pick a boat. Set sail.</p>
          </div>
          <ul class="flex flex-wrap gap-x-6 gap-y-2 text-xs font-semibold text-white/70">
            <li class="flex items-center gap-2"><i data-lucide="zap" class="h-4 w-4 text-brass-300"></i>Instant confirmation</li>
            <li class="flex items-center gap-2"><i data-lucide="lock" class="h-4 w-4 text-brass-300"></i>Secure checkout</li>
            <li class="flex items-center gap-2"><i data-lucide="ship-wheel" class="h-4 w-4 text-brass-300"></i>Captain included</li>
          </ul>
        </div>
        <ol id="stepper" class="mt-10 grid grid-cols-4 gap-2 md:gap-4" aria-label="Booking steps"></ol>
      </div>
    </section>

    <section class="relative z-10 -mt-16 pb-24">
      <div class="container grid gap-8 lg:grid-cols-[minmax(0,1fr)_380px]">
        <div id="step-container" class="min-w-0 scroll-mt-28"></div>
        <aside class="hidden lg:block"><div id="summary" class="sticky top-28"></div></aside>
      </div>
    </section>
  </main>

  <!-- Mobile summary bar -->
  <div id="mobile-summary" class="fixed inset-x-0 bottom-0 z-40 lg:hidden"></div>

  <div id="site-footer"></div>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/pages/booking.js"></script>
</body>
</html>
