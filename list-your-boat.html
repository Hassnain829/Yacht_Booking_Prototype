<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Boat — Chicago Yacht Booking</title>
  <meta name="description" content="List your boat or yacht on Chicago Yacht Booking and earn from charters with licensed captains, secure payments and full control of your calendar.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add('js')</script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-white font-sans text-navy-900 antialiased" data-page="list-boat">
  <!-- Laravel: resources/views/listings/create.blade.php (auth required).
       Each step can POST/PATCH to ListingController so drafts are saved server-side. -->
  <header class="fixed inset-x-0 top-0 z-50 bg-navy-950 text-white shadow-lg shadow-navy-950/20">
    <div class="flex h-16 items-center justify-between gap-4 px-4 md:px-8">
      <a href="index.html" class="group flex items-center gap-3" aria-label="Chicago Yacht Booking home">
        <span class="grid h-10 w-10 place-items-center rounded-full border border-brass-300/50 bg-white/5 text-brass-300 transition group-hover:bg-brass-400 group-hover:text-navy-950"><i data-lucide="anchor" class="h-5 w-5"></i></span>
        <span class="leading-none">
          <span class="block text-[9px] font-extrabold tracking-[0.42em] text-brass-300">CHICAGO</span>
          <span class="mt-1 block font-display text-lg text-white">Yacht Booking</span>
        </span>
      </a>
      <div class="flex items-center gap-4 text-sm md:gap-6">
        <p class="hidden items-center gap-2 text-white/70 md:flex" title="Rough estimate based on similar boats in Chicago">
          Estimated monthly earnings: <strong id="earnings" class="text-brass-300">—</strong>
        </p>
        <a href="contact.html" target="_blank" class="hidden font-semibold text-white/80 hover:text-white sm:inline">Support</a>
        <button id="save-exit" type="button" class="rounded-full border border-white/20 px-4 py-2 text-sm font-bold transition hover:bg-white hover:text-navy-950">Save and exit</button>
      </div>
    </div>
  </header>

  <main id="wizard" class="pb-20 pt-16"></main>

  <div id="wizard-bar" class="fixed inset-x-0 bottom-0 z-40 border-t border-navy-100 bg-white/95 backdrop-blur"></div>

  <input type="file" id="photo-input" accept="image/*" multiple class="hidden">

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pages/list-boat.js"></script>
</body>
</html>
